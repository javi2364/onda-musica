name: Compilar Onda iPhone (IPA sin firmar)
on:
  push:
    paths:
      - 'ios/OndaNative/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto Xcode
        working-directory: ios/OndaNative
        run: xcodegen generate
      - name: Compilar aplicación para iPhone (sin firmar)
        working-directory: ios/OndaNative
        run: |
          set -euo pipefail
          xcodebuild -project OndaPersonal.xcodeproj \
            -scheme OndaPersonal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Empaquetar archivo IPA para firmar en Windows
        working-directory: ios/OndaNative
        run: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/OndaPersonal.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OndaPersonal.app Payload/
          zip -qyr OndaPersonal-unsigned.ipa Payload
          unzip -t OndaPersonal-unsigned.ipa
      - name: Guardar IPA como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: OndaPersonal-unsigned-IPA
          path: ios/OndaNative/OndaPersonal-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
