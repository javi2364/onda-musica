name: OndaPersonal
options:
  bundleIdPrefix: com.onda.personal
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  OndaPersonal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Onda/Sources
      - path: Onda/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onda.personal.music
        INFOPLIST_FILE: Onda/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Onda/Info.plist
      properties:
        CFBundleDisplayName: Onda
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
